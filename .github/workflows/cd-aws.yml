# ==============================================================================
# GitHub Actions Workflow: Continuous Deployment (CD) to AWS (ECR + App Runner)
# ==============================================================================
# Purpose:
# Automatically builds the container, pushes it to Amazon Elastic Container Registry (ECR),
# and deploys/updates the serverless microservice on AWS App Runner.
#
# Triggers:
# - Runs automatically when CI completes successfully on 'main' or 'dev'
# - Can also be triggered manually using workflow_dispatch
#
# AWS Secrets Required in GitHub:
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - AWS_REGION (e.g. us-east-1)
# ==============================================================================

name: CD - Deploy to AWS App Runner

on:
  workflow_run:
    workflows: [ "CI - Test, Train & Validate" ]
    branches: [ "main", "dev" ]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-aws:
    name: Build, Push to ECR & Deploy to AWS App Runner
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Step 1: Check out repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Validate AWS Secret Configuration
      - name: Verify AWS Secrets
        id: check_aws
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "::warning::AWS credentials are not configured in GitHub Secrets."
            echo "Please add AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_REGION to GitHub Secrets."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      # Step 3: Setup Python and Train Model to guarantee artifacts are in sync
      - name: Set up Python & Train Model
        if: steps.check_aws.outputs.has_secrets == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Train Pipeline
        if: steps.check_aws.outputs.has_secrets == 'true'
        run: |
          pip install -r requirements.txt
          python -m src.train

      # Step 4: Configure AWS Credentials
      - name: Configure AWS Credentials
        if: steps.check_aws.outputs.has_secrets == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      # Step 5: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        if: steps.check_aws.outputs.has_secrets == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 6: Ensure ECR Repository Exists
      - name: Ensure ECR Repository Exists
        if: steps.check_aws.outputs.has_secrets == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: house-price-api
        run: |
          echo "Checking if repository '$ECR_REPOSITORY' exists..."
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --image-scanning-configuration scanOnPush=true
          echo "ECR Repository is ready."

      # Step 7: Build, Tag & Push Docker Image to ECR
      - name: Build, Tag & Push Image to Amazon ECR
        if: steps.check_aws.outputs.has_secrets == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: house-price-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "Building Docker image: $IMAGE_URI"
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" .
          echo "Pushing Docker image to Amazon ECR..."
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      # Step 8: Trigger App Runner Deployment (if service exists)
      - name: Deploy to AWS App Runner
        if: steps.check_aws.outputs.has_secrets == 'true'
        env:
          SERVICE_NAME: house-price-service
        run: |
          echo "Checking if App Runner service '$SERVICE_NAME' exists..."
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" --output text)
          
          if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
            echo "Service found: $SERVICE_ARN"
            echo "Starting deployment with latest image..."
            aws apprunner start-deployment --service-arn "$SERVICE_ARN"
            echo "Deployment triggered successfully on AWS App Runner!"
          else
            echo "::notice::AWS App Runner service '$SERVICE_NAME' is not yet created."
            echo "Image has been successfully pushed to Amazon ECR: $IMAGE_URI"
            echo "You can now create the App Runner service in the AWS Console in 2 clicks pointing to this ECR image!"
          fi
